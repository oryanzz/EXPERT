name: Release exe

# Builds the single-file EXPERT.exe for every published release, self-tests its OCR, and attaches
# it to the release (with a SHA256 checksum and the bundled third-party licenses).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-build.txt
      - name: Build EXPERT.exe
        run: python -m PyInstaller --noconfirm --clean EXPERT.spec
      - name: Self-test the exe's OCR
        shell: pwsh
        run: |
          $p = Start-Process dist\EXPERT.exe -ArgumentList '--selftest', 'tests\fixtures\sample_game.png', 'selftest.json' -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\EXPERT.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  EXPERT.exe" | Set-Content -NoNewline -Encoding ascii dist\EXPERT.exe.sha256
          Get-Content dist\EXPERT.exe.sha256
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" dist/EXPERT.exe dist/EXPERT.exe.sha256 THIRD_PARTY_LICENSES.txt --clobber
